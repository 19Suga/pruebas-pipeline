name: Deploy pagina estatica en pages

on:
  # cuando se hace push
  push:
    branches: ["main"]
  # ejecutar manualmente desde la ventana de github actions
  workflow_dispatch:

permissions:
  # permisos necesarios para que github actions escriba en el despliegue en consola
  contents: read
  pages: write
  id-token: write

# solo permite un despliegue a la vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1 Revisar codigo
      - name: Checkout
        uses: actions/checkout@v4

      # 2 preparacion de github pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 3 carga de archivos a github pages
      - name: Carga artifactos
        uses: actions/upload-pages-artifact@v3
        with:
          # carpeta donde esta la web (index.html)
          path: '.'

      # desplegar los archivos con github pages
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
